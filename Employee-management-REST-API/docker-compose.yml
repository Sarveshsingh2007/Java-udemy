
services:
  app:
    build: .
    ports:
      - "8080:8080"
    networks:
      - employee-network
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: employee
      POSTGRES_PASSWORD: Sarvesh123
    networks:
      - employee-network
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d employee"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  employee-network:
    driver: bridge

volumes:
  postgres-data:
