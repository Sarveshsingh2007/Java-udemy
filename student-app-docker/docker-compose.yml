services:
  app:
    build: .
    ports:
      - "8080:8080"
    networks:
      - s-network
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Sarvesh123
      POSTGRES_DB: Sarvesh
    ports:
      - 5432:5432
    networks:
      - s-network
    volumes:
      - postgres-data:/var/lib/postgresql

networks:
  s-network:
    driver: bridge

volumes:
  postgres-data:

